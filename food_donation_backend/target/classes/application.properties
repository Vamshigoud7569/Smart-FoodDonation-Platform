# Server Configuration
server.port=8080
#server.servlet.context-path=/FoodDonation

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/food_donation_platform

spring.datasource.username=root
spring.datasource.password=Vamshi@143

logging.level.org.springframework.http.converter=TRACE
logging.level.com.fasterxml.jackson=DEBUG
spring.jpa.hibernate.ddl-auto=update


spring.jpa.show-sql=true

app.upload.dir=uploads/verification
app.upload.max-file-size=5MB
app.upload.base-url=/files

server.error.include-message=always
server.error.include-stacktrace=always
logging.level.org.springframework.web=DEBUG

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true

# JWT Configuration
jwt.secret=foodshare-secret-key-must-be-at-least-32-characters-long
jwt.expiration=86400000

